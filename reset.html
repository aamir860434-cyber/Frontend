<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ConnectChat – New password</title><link rel="stylesheet" href="app.css"></head><body class="authbody">
<div class="authwrap"><div class="authcard">
 <div class="alogo">🔑</div><h1>Set a new password</h1><p class="tag">Choose a strong password</p>
 <form id="f" class="frm">
  <input id="pw" type="password" placeholder="New password (min 8 characters)" autocomplete="new-password" required>
  <input id="pw2" type="password" placeholder="Repeat new password" autocomplete="new-password" required>
  <button class="btn">Change password</button>
 </form>
 <div id="msg" class="msg"></div><p class="note"><a href="login.html">Back to login</a></p>
</div></div>
<script src="reset.js" defer></script></body></html>
